<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Getting to Know My Tongue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: "sticker" game board — top bar with star tray, one panel that swaps screens. Single light theme on purpose. */
:root{
  --sky:#CFEAFF; --sky2:#EAF6FF; --paper:#FFFFFF; --ink:#22304A; --muted:#55657F;
  --sun:#FFC531; --sunDeep:#E69A00; --coral:#FF6B4A; --mint:#23B585; --mintSoft:#D7F6EA;
  --berry:#E3456A; --berrySoft:#FFE1E8; --grape:#7C5CFF;
  --display:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --bounce:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;font-family:var(--body);color:var(--ink);font-size:16px;background:var(--sky);background-image:radial-gradient(rgba(255,255,255,.55) 2px,transparent 2.5px);background-size:26px 26px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.card:focus-visible,.spot:focus-visible{outline:4px solid var(--grape);outline-offset:3px}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px;padding-inline:16px;background:var(--paper);border-bottom:4px solid var(--ink)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg,.brand img{flex:none;width:38px;height:38px;object-fit:contain}
.brand h1{font-family:var(--display);font-weight:800;font-size:1.45rem;line-height:1.05;margin:0;letter-spacing:.2px}
.tray{display:flex;align-items:center;gap:4px;margin-left:auto;padding:6px 10px;border-radius:999px;background:var(--sky2);border:3px solid var(--ink);flex-wrap:wrap;justify-content:center}
.slot{width:26px;height:26px;display:grid;place-items:center;transition:transform .35s var(--bounce)}
.slot svg{width:100%;height:100%;fill:none;stroke:#9DB3CC;stroke-width:1.6;stroke-dasharray:3 2}
.slot.on svg{fill:var(--sun);stroke:var(--sunDeep);stroke-width:1.4;stroke-dasharray:none}
.slot.on{animation:land .5s var(--bounce)}
.slot.on:hover{transform:scale(1.35) rotate(18deg)}
.tray .sep{width:3px;height:22px;background:#9DB3CC;border-radius:2px;margin-inline:4px}
@keyframes land{0%{transform:scale(1.9)}100%{transform:scale(1)}}
.iconbtn{width:44px;height:44px;border-radius:14px;border:3px solid var(--ink);background:var(--paper);display:grid;place-items:center;box-shadow:0 4px 0 var(--ink);transition:transform .25s var(--bounce),box-shadow .25s var(--bounce)}
.iconbtn:hover{transform:translateY(-3px) rotate(-6deg);box-shadow:0 7px 0 var(--ink)}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.iconbtn svg{width:24px;height:24px}
.tray:empty{display:none}
.top .spacer{margin-left:auto}

/* ---------- stage ---------- */
main{max-width:1060px;margin:0 auto;padding-block:18px 40px;padding-inline:16px}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.step{font-family:var(--display);font-weight:700;font-size:1rem;padding:4px 14px;border-radius:999px;border:3px solid var(--ink);background:var(--paper);opacity:.55}
.step.now{opacity:1;background:var(--sun)}
.step.done{opacity:1;background:var(--mintSoft)}
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:20px}
.screen-title{font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,3.4vw,2rem);line-height:1.1;margin:0 0 4px;text-wrap:balance}
.lead{margin:0 0 14px;color:var(--muted);font-weight:700;font-size:1.05rem}
.lead:empty{display:none}

/* ---------- intro ---------- */
.intro{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.intro h2{font-family:var(--display);font-size:clamp(2rem,6vw,3.4rem);line-height:1;margin:0 0 10px;text-wrap:balance}
.intro p{font-size:1.15rem;font-weight:700;color:var(--muted);margin:0 0 8px;max-width:48ch}
.intro ol{margin:10px 0 20px;padding-left:1.3em;font-weight:800;font-size:1.1rem;display:grid;gap:6px}
.bigart{width:min(250px,40vw);aspect-ratio:1;border-radius:50%;border:5px solid var(--ink);background:#fff;overflow:hidden;position:relative;box-shadow:0 8px 0 var(--ink)}
.bigart img{position:absolute;left:11%;top:11%;width:78%;height:78%;object-fit:contain;animation:wobble 3.2s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-1%)}}
@media (max-width:620px){.intro{grid-template-columns:1fr}.bigart{display:none}}

/* ---------- buttons ---------- */
.btn{font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:.3px;display:inline-flex;align-items:center;gap:10px;padding:10px 26px;border-radius:18px;border:4px solid var(--ink);background:var(--coral);color:#fff;box-shadow:0 6px 0 var(--ink);transition:transform .3s var(--bounce),box-shadow .3s var(--bounce),background .2s}
.btn:hover{transform:translateY(-4px) scale(1.04);box-shadow:0 10px 0 var(--ink)}
.btn:hover .wig{animation:wig .5s ease}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn:disabled,.btn:disabled:hover{opacity:.4;cursor:not-allowed;transform:none;box-shadow:0 6px 0 var(--ink);filter:grayscale(.5)}
.btn:disabled:hover .wig{animation:none}
.btn.alt{background:var(--paper);color:var(--ink)}
.btn svg.redo{fill:none;stroke:var(--ink)}
#practiceBtn svg.redo{stroke:#fff}
.btn.go{background:var(--mint)}
.btn svg{width:26px;height:26px;fill:var(--sun);stroke:var(--ink);stroke-width:1.6}
.btn svg.chk{fill:none}
.btn.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.next-wrap{display:flex;justify-content:center;margin-top:16px}
.next-wrap.row{justify-content:center}

/* ---------- rope board ---------- */
.rboard{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,var(--mid,1.2fr)) minmax(0,1fr);gap:clamp(18px,4.5vw,52px);align-items:center;user-select:none;-webkit-user-select:none;padding-block:4px}
.rcol{display:flex;flex-direction:column;gap:18px;position:relative;z-index:3}
.specimen{position:relative;background:#fff;border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:8px;width:100%;max-width:var(--specMax,420px);justify-self:center}
.fig{position:relative;width:100%;max-width:100%}
.fig img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none;border-radius:12px;object-fit:contain}
#ropeLayer{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:2}
.plugs{position:absolute;inset:0;pointer-events:none;z-index:4}
.plug{position:absolute;left:0;top:0;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:var(--rc);border:3px solid var(--ink);box-shadow:inset 0 0 0 3px #fff;will-change:transform;transition:width .2s,height .2s,margin .2s}
.plug.idle{width:18px;height:18px;margin:-9px 0 0 -9px;box-shadow:none}
.plug.grab{pointer-events:auto;cursor:grab;touch-action:none}
.plug.grab::after{content:"";position:absolute;inset:-12px;border-radius:50%}
.plug.grab:hover{width:34px;height:34px;margin:-17px 0 0 -17px}
.plug.locked{display:none}
.card{--rc:var(--grape);touch-action:none;user-select:none;-webkit-user-select:none;font-family:var(--display);font-weight:800;font-size:1.15rem;line-height:1.1;text-align:left;padding:12px 16px;border-radius:16px;border:3px solid var(--ink);background:var(--paper);box-shadow:0 5px 0 var(--ink);cursor:grab;width:100%;display:flex;align-items:center;gap:10px;transition:transform .35s var(--bounce),box-shadow .35s var(--bounce),background .2s}
.card:nth-child(odd){background:#FFF4D6}
.card:nth-child(even){background:#E6F1FF}
.card:hover{transform:translateY(-4px) rotate(-2deg) scale(1.04);box-shadow:0 9px 0 var(--ink)}
.card.sel{background:var(--sun);transform:translateY(-4px) scale(1.04);box-shadow:0 9px 0 var(--ink)}
.card.dragging{transform:scale(1.02);box-shadow:0 2px 0 var(--ink)}
.card.no{animation:shake .45s ease}
.card.ok,.card.ok:hover,.card.ok:nth-child(odd),.card.ok:nth-child(even){background:#EEF1F5;color:#8C99AD;border-color:#B9C7DA;box-shadow:0 3px 0 #B9C7DA;transform:none;cursor:default;filter:grayscale(1)}
.spot{position:absolute;z-index:1;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;border:3px dashed var(--ink);background:rgba(255,255,255,.88);display:grid;place-items:center;padding:0;font-family:var(--display);font-weight:800;font-size:17px;line-height:1;color:var(--muted);transition:transform .3s var(--bounce),background .2s}
.spot:not(.ok):not(.filled):hover{transform:translate(-50%,-50%) scale(1.15);background:#FFF5CC}
.spot.filled:hover{transform:translate(-50%,-50%) scale(1.12)}
.spot.hot{transform:translate(-50%,-50%) scale(1.3);background:#FFF5CC;border-color:var(--sunDeep);border-style:solid;box-shadow:0 0 0 6px rgba(255,197,49,.45)}
.spot.filled{border-style:solid;background:var(--rc)}
.spot.ok{z-index:5;width:40px;height:40px;border:0;background:none;cursor:pointer;animation:popc .5s var(--bounce)}
.spot.ok svg{width:100%;height:100%;filter:drop-shadow(0 3px 0 rgba(34,48,74,.35))}
.spot.no{animation:shakec .45s ease;background:var(--berrySoft);border-color:var(--berry)}
.spot.hint{animation:hint .65s ease-in-out 4;border-color:var(--sunDeep);border-style:solid}
@keyframes popc{0%{transform:translate(-50%,-50%) scale(.5)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes shakec{0%,100%{transform:translate(-50%,-50%)}20%{transform:translate(calc(-50% - 8px),-50%)}40%{transform:translate(calc(-50% + 8px),-50%)}60%{transform:translate(calc(-50% - 6px),-50%)}80%{transform:translate(calc(-50% + 5px),-50%)}}
@keyframes hint{0%,100%{background:rgba(255,255,255,.88);box-shadow:none}50%{background:#FFE48A;box-shadow:0 0 0 8px rgba(255,197,49,.6)}}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(5px)}}
.counter{font-family:var(--display);font-weight:800;font-size:1.1rem;padding:6px 14px;border-radius:999px;border:3px solid var(--ink);background:var(--sky2);font-variant-numeric:tabular-nums}
.info{margin-top:16px;display:flex;gap:12px;align-items:center;background:var(--sky2);border:3px solid var(--ink);border-radius:18px;padding:12px 14px}
.info .badge{flex:none;width:46px;height:46px;border-radius:50%;background:var(--sun);border:3px solid var(--ink);display:grid;place-items:center}
.info .badge svg{width:26px;height:26px}
.info p{margin:0;font-weight:800;font-size:1.1rem;flex:1;min-width:0}
.info.good{background:var(--mintSoft)}
.info.bad{background:var(--berrySoft)}
.info.flash{animation:pop .45s var(--bounce)}

/* ---------- ordering with ropes ---------- */
.rboard.order2{grid-template-columns:minmax(0,1fr) minmax(130px,.42fr)}
.order2 .rcol .card{font-size:1.05rem;line-height:1.2;font-family:var(--body);font-weight:800}
.tcol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px;position:relative;z-index:3}
.tslot{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 14px 8px 8px;border:3px dashed #9DB3CC;border-radius:16px;background:var(--paper);font-family:var(--display);font-weight:800;font-size:1.15rem;color:var(--muted);cursor:pointer;transition:transform .3s var(--bounce),background .2s,border-color .2s}
.tslot:hover{transform:scale(1.04);background:#FFFBEA}
.tslot.hot{transform:scale(1.08);border-style:solid;border-color:var(--sunDeep);background:#FFF5CC;box-shadow:0 0 0 6px rgba(255,197,49,.45)}
.tslot.done{border-style:solid;border-color:#B9C7DA;background:#EEF1F5;color:#8C99AD;cursor:default;transform:none}
.sock{flex:none;width:36px;height:36px;border-radius:50%;border:3px dashed var(--ink);background:rgba(255,255,255,.9);display:grid;place-items:center;position:relative;z-index:5}
.sock.filled{border-style:solid;background:var(--rc)}
.sock.ok{border:0;background:none;animation:pop .5s var(--bounce)}
.sock.ok svg{width:100%;height:100%;filter:drop-shadow(0 3px 0 rgba(34,48,74,.35))}
.sock.no{animation:shake .45s ease;background:var(--berrySoft);border-color:var(--berry)}
.sock.hint{animation:hint .65s ease-in-out 4;border-color:var(--sunDeep);border-style:solid}

/* ---------- quiz ---------- */
.quiz{max-width:760px;margin:0 auto}
.dots{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.dot{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink);background:var(--paper)}
.dot.now{background:var(--sun);transform:scale(1.2)}
.dot.r{background:var(--mint)}
.dot.w{background:var(--berry)}
.qcard{position:relative;background:var(--sky2);border:4px solid var(--ink);border-radius:22px;padding:22px;min-height:120px;display:flex;align-items:center}
.qcard p{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(1.35rem,3.4vw,1.9rem);line-height:1.2;text-wrap:balance}
.qcard.in{animation:slidein .45s var(--bounce)}
@keyframes slidein{0%{transform:translateX(40px) rotate(2deg);opacity:0}100%{transform:none;opacity:1}}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.ans{font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,4vw,2rem);padding:16px 10px;border-radius:22px;border:4px solid var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 7px 0 var(--ink);transition:transform .3s var(--bounce),box-shadow .3s var(--bounce),opacity .2s,filter .2s}
.ans svg{width:38px;height:38px;flex:none}
.ans.t{background:var(--mint)}
.ans.f{background:var(--berry)}
.ans.mc{font-size:clamp(1.05rem,2.6vw,1.35rem);justify-content:flex-start;text-align:left;padding:14px 16px;line-height:1.2;color:var(--ink);background:var(--opt)}
.ans.mc .ltr{flex:none;width:38px;height:38px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-size:1.1rem}
.ans:hover:not(:disabled){transform:translateY(-6px) rotate(-2deg) scale(1.04);box-shadow:0 13px 0 var(--ink)}
.ans.f:hover:not(:disabled),.ans.mc:nth-child(even):hover:not(:disabled){transform:translateY(-6px) rotate(2deg) scale(1.04)}
.ans:hover:not(:disabled) svg,.ans:hover:not(:disabled) .ltr{animation:wig .5s ease}
.ans:active:not(:disabled){transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.ans:disabled{cursor:default}
.ans.dim{opacity:.35;filter:grayscale(.6)}
.ans.right{animation:pop .45s var(--bounce);box-shadow:0 0 0 6px var(--sun),0 7px 0 var(--ink)}
.ans.wrongpick{animation:shake .45s ease}
.qmode{display:inline-block;margin:0 0 6px;padding:3px 12px;border-radius:999px;background:var(--grape);color:#fff;font-weight:800;font-size:.9rem}

/* ---------- result ---------- */
.result{text-align:center;max-width:720px;margin:0 auto}
.bigstars{display:flex;justify-content:center;gap:6px;margin:10px 0 6px;flex-wrap:wrap}
.bigstars svg{width:clamp(40px,10vw,64px);height:auto;fill:#E3ECF6;stroke:#9DB3CC;stroke-width:1.2}
.bigstars svg.on{fill:var(--sun);stroke:var(--sunDeep);animation:land .6s var(--bounce) both}
.result h2{font-family:var(--display);font-size:clamp(1.8rem,5vw,2.6rem);margin:6px 0 2px}
.result .sum{font-weight:800;font-size:1.15rem;color:var(--muted);margin:0 0 16px}
.pnote{margin:-6px 0 14px;font-weight:800;color:var(--grape)}
.review{text-align:left;display:grid;gap:10px;margin:0 0 20px}
.review div{border:3px solid var(--ink);border-radius:16px;padding:10px 14px;background:var(--berrySoft);font-weight:700}
.review b{font-family:var(--display);font-size:1.1rem}
.result .row{justify-content:center}

/* ---------- flying star ---------- */
.fly{position:fixed;left:0;top:0;width:120px;height:120px;z-index:80;pointer-events:none}
.fly svg{width:100%;height:100%;filter:drop-shadow(0 6px 0 rgba(34,48,74,.25));fill:var(--sun);stroke:var(--sunDeep);stroke-width:1.2}
.spark{position:fixed;left:0;top:0;width:12px;height:12px;border-radius:50%;z-index:79;pointer-events:none}
.panel:not([hidden]){animation:sceneIn .5s var(--bounce)}
@keyframes sceneIn{0%{opacity:.4;transform:scale(.97)}100%{opacity:1;transform:none}}

@media (max-width:760px){
  .rboard{grid-template-columns:1fr;gap:20px}
  .rcol{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:10px}
  .rcol .card{flex:1 1 140px;width:auto;justify-content:center;text-align:center;font-size:1rem;padding:10px 10px}
  .specimen{max-width:min(var(--specMax,420px),100%)}
  .rboard.order2{grid-template-columns:minmax(0,1fr) 84px;gap:30px}
  .order2 .rcol{flex-direction:column;gap:12px}
  .order2 .rcol .card{flex:none;width:100%;justify-content:flex-start;text-align:left;font-size:.95rem;padding:10px 12px}
  .tcol{gap:12px}
  .tslot{padding:6px 10px 6px 6px;gap:8px;font-size:1.1rem}
  .tslot .w{display:none}
  .answers.mcgrid{grid-template-columns:1fr}
}
@media (max-width:640px){
  .top{gap:6px 10px;padding-block:8px;padding-inline:12px}
  .brand{flex:1 1 0;min-width:0}
  .brand h1{font-size:1.05rem;line-height:1.1}
  .brand svg,.brand img{width:30px;height:30px}
  .tray{order:3;margin-left:0;width:100%;justify-content:center;padding:4px 8px;gap:2px}
  .slot{width:19px;height:19px}
  .iconbtn{width:38px;height:38px;border-radius:12px}
  main{padding-block:10px 24px;padding-inline:10px}
  .steps{margin-bottom:8px}
  .step{display:none;font-size:.9rem;padding:2px 12px}
  .step.now{display:inline-block}
  .panel{padding:12px;border-width:3px;border-radius:20px;box-shadow:0 5px 0 var(--ink)}
  .screen-title{font-size:1.3rem}
  .lead{font-size:.95rem;margin-bottom:10px}
  .card{box-shadow:0 4px 0 var(--ink);border-radius:13px}
  .info{margin-top:10px;padding:8px 10px;gap:8px;border-radius:14px}
  .info .badge{width:34px;height:34px}
  .info .badge svg{width:20px;height:20px}
  .info p{font-size:.95rem}
  .btn{font-size:1.08rem;padding:8px 16px;border-radius:14px;border-width:3px;box-shadow:0 4px 0 var(--ink)}
  .btn svg{width:20px;height:20px}
  .next-wrap{margin-top:12px}
  .qcard{padding:16px;min-height:96px}
  .answers{gap:10px;margin-top:14px}
  .ans{padding:12px 8px;border-radius:18px}
  .ans svg{width:28px;height:28px}
  .spot{width:30px;height:30px;font-size:14px}
  .spot.ok{width:34px;height:34px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="star" viewBox="0 0 24 24"><path d="M12 2.2l2.9 6.4 7 .7-5.3 4.7 1.6 6.9L12 17.3l-6.2 3.6 1.6-6.9L2.1 9.3l7-.7z" stroke-linejoin="round"/></symbol>
    <symbol id="spk" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#22304A"/><path d="M16 8.5c1.3 1 1.3 6 0 7M18.5 6c2.6 2.3 2.6 9.7 0 12" fill="none" stroke="#22304A" stroke-width="2.2" stroke-linecap="round"/></symbol>

w of the tongue","spots":[{"label":"Tip of the tongue","info":"The tip of the tongue has taste buds and can taste all tastes. It helps us make sounds like “t, d, l, n” when we talk.","x":53.5,"y":91.5},{"label":"Side of the tongue","info":"The sides of the tongue have taste buds too. When we chew, the sides push the food between our teeth.","x":33.2,"y":72},{"label":"Top of the tongue","info":"The top of the tongue is covered with tiny bumps. These bumps make the tongue rough. Some of them have taste buds.","x":64,"y":66},{"label":"Bumps with taste buds","info":"These big bumps sit in a row at the back of the tongue, and many taste buds are around them. Taste buds are so small that we cannot see them.","x":67.3,"y":48.5},{"label":"Back of the tongue","info":"This is the very back of the tongue, also called the root. It can taste too. When we swallow, it pushes the food toward our throat.","x":53.5,"y":34},{"label":"Tonsil","info":"Tonsils are not part of the tongue. They are on both sides of our throat and help protect our body from germs.","x":71.4,"y":25.5}]},"s2":{"enabled":true,"title":"The journey of taste","lead":"How do we taste food? Connect each step’s rope to the right number. When all are connected, press “Check”.","hint":"Hint: It all starts when we put food in our mouth.","steps":[{"text":"We put food in our mouth and chew it.","info":"Our tongue moves the food around in our mouth, and our teeth break it into small pieces."},{"text":"Saliva wets the food and dissolves its taste substances.","info":"Without saliva, taste substances could not reach the taste buds."},{"text":"The dissolved taste substances reach the taste buds.","info":"Taste buds are found in the bumps on the tongue."},{"text":"Receptors in the taste buds sense the taste.","info":"Receptors are very tiny parts that notice taste substances."},{"text":"Nerves carry the message to the brain, and the brain decides the taste.","info":"Our brain decides if what we eat is sweet, salty, sour or bitter."}]},"s3":{"enabled":true,"count":5,"noRepeat":true,"practice":true,"questions":[{"type":"tf","q":"The tongue is our sense organ for taste.","a":true,"e":"We taste food with our tongue."},{"type":"tf","q":"Every part of the tongue can taste sweet, salty, sour and bitter.","a":true,"e":"Taste buds are on the tip, the sides and the back of the tongue. Every part can taste all tastes."},{"type":"tf","q":"Only the tip of the tongue can taste sweet things.","a":false,"e":"This is an old mistake. Every part of the tongue can taste sweet too."},{"type":"tf","q":"Taste buds are found in the bumps on our tongue.","a":true,"e":"Taste buds are in and around the bumps on the tongue."},{"type":"tf","q":"We can easily see taste buds with our eyes.","a":false,"e":"Taste buds are very small. We cannot see them with our eyes."},{"type":"tf","q":"Saliva dissolves the taste substances in food.","a":true,"e":"Saliva dissolves taste substances so they can reach the taste buds."},{"type":"tf","q":"We can taste very dry food right away, even before saliva wets it.","a":false,"e":"Food must be wet with saliva before we can taste it."},{"type":"tf","q":"When our nose is blocked, we cannot fully taste our food.","a":true,"e":"Taste and smell work together. When our nose cannot smell, food tastes less."},{"type":"tf","q":"Our brain decides what the food we eat tastes like.","a":true,"e":"Receptors on the tongue send messages to the brain through nerves. The brain decides the taste."},{"type":"tf","q":"Our tongue is only for tasting.","a":false,"e":"Our tongue also helps us talk, chew and swallow."},{"type":"tf","q":"Our tongue helps us make sounds correctly when we talk.","a":true,"e":"Without our tongue, we could not say many sounds correctly."},{"type":"tf","q":"When we swallow, our tongue pushes the food toward our throat.","a":true,"e":"To swallow, the back of the tongue pushes the food toward the throat."},{"type":"tf","q":"Tonsils are part of our tongue.","a":false,"e":"Tonsils are not part of the tongue. They are on both sides of our throat."},{"type":"tf","q":"Very hot food and drinks can hurt our tongue.","a":true,"e":"Very hot food can burn our tongue. We should wait for it to cool a little."},{"type":"tf","q":"The burning feeling from hot peppers is a taste.","a":false,"e":"The burn from hot peppers is not a taste. Our tongue feels it like a burn."},{"type":"tf","q":"The top of our tongue is smooth and slippery.","a":false,"e":"The top of the tongue is covered with tiny bumps, so it is rough."},{"type":"mc","q":"What does a lemon taste like?","options":["Sweet","Sour","Salty","Bitter"],"correct":1,"e":"A lemon is a good example of a sour taste."},{"type":"mc","q":"Where are taste buds found?","options":["On our teeth","In the bumps on our tongue","In our nose"],"correct":1,"e":"Taste buds are in and around the bumps on the tongue."}]}};

function drawSignals(P,now,locked,seed){
  if(reduce||O.signals===false)return;

  for(i=1;i<P.length;i++){L+=Math.hypot(P[i].x-P[i-1].x,P[i].y-P[i-1].y);seg.push(L)}

    while(j<seg.length-1&&seg[j]<d)j++;

function RopeGame(cfg){

    if(c.l>=ar.r-2)return {x:c.l,y:c.t+c.h/2};

      if(t.el!==t.sock&&cx>=er.left-6&&cx<=er.right+6&&cy>=er.top-6&&cy<=er.bottom+6)return id;
      var r=t.sock.getBoundingClientRect(),d=Math.hypot(r.left+r.width/2-cx,r.top+r.height/2-cy);

  function setHot(id,on){G.tg[id].el.classList.toggle('hot',on)}

    /* mode: 'passed-completed' (default) = passed above the pass mark, otherwise completed;
       'passed-failed' = passed or failed; 'completed' = always completed */
    var mode=O.lmsMode||'passed-completed', ok=pct>=pass;
    if(ver==='2004'){
      set('','cmi.score.raw',pct);set('','cmi.score.min',0);set('','cmi.score.max',100);set('','cmi.score.scaled',(pct/100).toFixed(2));
      set('','cmi.completion_status','completed');
      if(mode!=='completed')set('','cmi.success_status',ok?'passed':(mode==='passed-failed'?'failed':'unknown'));
    }else{
      set('cmi.core.score.raw','',pct);set('cmi.core.score.min','',0);set('cmi.core.score.max','',100);
      set('cmi.core.lesson_status','',mode==='completed'?'completed':ok?'passed':(mode==='passed-failed'?'failed':'completed'));
    }
    set('cmi.suspend_data','cmi.suspend_data',JSON.stringify({stars:stars,score:sc}));
    commit();
  }};
})();

/* ================= FULLSCREEN ================= */
(function(){
  var b=$('fsBtn'), el=document.documentElement;
  var can=O.fullscreen!==false&&!!(el.requestFullscreen||el.webkitRequestFullscreen)&&(document.fullscreenEnabled!==false||document.webkitFullscreenEnabled);
  if(!can){b.hidden=true;return}
  b.setAttribute('aria-label',T.fs); b.title=T.fs;
  function isFs(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
  function sync(){var f=isFs();b.querySelector('use').setAttribute('href',f?'#fsOff':'#fsOn');b.setAttribute('aria-label',f?T.fsOff:T.fs)}
  b.addEventListener('click',function(){
    SFX.click();
    try{
      if(isFs()){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
      else{var p=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);if(p&&p.catch)p.catch(function(){b.hidden=true})}
    }catch(e){b.hidden=true}
  });
  document.addEventListener('fullscreenchange',sync); document.addEventListener('webkitfullscreenchange',sync);
})();

/* ================= INTRO + START ================= */
var IN=C.intro||{};
$('introHead').textContent=IN.heading||C.title||'';
$('introText').textContent=IN.text||''; $('introText').hidden=!IN.text;
(function(){
  var ol=$('introList');
  ORDER.forEach(function(k){var li=document.createElement('li');li.textContent=k==='s1'?T.intro1:k==='s2'?T.intro2:T.intro3(QUIZ_N);ol.appendChild(li)});
  if(STARS&&(DRAG_STARS||Q_STARS)){var li=document.createElement('li');li.textContent=T.introStar;ol.appendChild(li)}
  var img=IN.image||(S1?S1.image:'');
  if(img)$('introImg').src=img;else $('introArt').hidden=true;
})();
function begin(){clearSlots(0,slots.length);go(ORDER[0]||'result')}
$('startBtn').addEventListener('click',function(){actx();SFX.click();begin()});
$('redo1').addEventListener('click',function(){SFX.click();cancelFlights();clearSlots(0,DRAG_STARS);startStage1()});
$('redo2').addEventListener('click',function(){SFX.click();cancelFlights();startStage2()});
$('next1').addEventListener('click',function(){SFX.click();go(nextOf('s1'))});
$('next2').addEventListener('click',function(){SFX.click();go(nextOf('s2'))});
$('retryQuiz').addEventListener('click',function(){SFX.click();cancelFlights();startQuiz()});
$('practiceBtn').addEventListener('click',function(){SFX.click();cancelFlights();startPractice()});
$('restart').addEventListener('click',function(){SFX.click();cancelFlights();if(IN.enabled!==false)show('intro');else begin()});
[].forEach.call(document.querySelectorAll('.btn,.iconbtn'),hoverFx);
if(!ORDER.length){show('result');}
else if(IN.enabled!==false)show('intro');
else begin();
})();
</script>
